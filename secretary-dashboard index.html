<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة السكرتيرة - العيادة الذكية</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Tahoma', Arial, sans-serif;
    background: #f0fdfa;
    margin: 0;
    padding: 20px 16px;
  }
  .wrap { max-width: 600px; margin: 0 auto; }
  .box {
    background: white;
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  }
  h2 { color: #0f766e; margin: 0 0 4px 0; text-align: center; }
  p.subtitle { text-align: center; color: #64748b; font-size: 13px; margin: 0 0 20px 0; }

  .login-gate input { width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 10px; font-size: 14px; box-sizing: border-box; }
  button.main {
    width: 100%; padding: 12px; background: #0d9488; color: white;
    border: none; border-radius: 8px; font-size: 15px; font-weight: bold;
    cursor: pointer;
  }
  button.main:hover { background: #0f766e; }

  .booking-card {
    background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .booking-top { display: table; width: 100%; }
  .booking-top .left { display: table-cell; text-align: left; color: #64748b; font-size: 12px; }
  .booking-top .right { display: table-cell; text-align: right; font-weight: bold; color: #0f172a; font-size: 15px; }
  .booking-meta { font-size: 12.5px; color: #475569; margin-top: 6px; }
  .status-tag {
    display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: bold;
  }
  .status-pending_payment { background: #fef3c7; color: #92400e; }
  .status-confirmed { background: #d1fae5; color: #065f46; }
  .status-completed { background: #e0e7ff; color: #3730a3; }
  .status-cancelled { background: #fee2e2; color: #991b1b; }

  .no-bookings { text-align: center; color: #94a3b8; padding: 30px 0; }
  .checkin-btn {
    margin-top: 8px; padding: 7px 14px; background: #0d9488; color: white;
    border: none; border-radius: 6px; font-size: 12.5px; cursor: pointer;
  }
  .checkin-btn:hover { background: #0f766e; }
  .refresh-btn {
    background: #f1f5f9; color: #0f766e; border: 1px solid #cbd5e1;
    border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; margin-bottom: 14px;
  }
  .footer-brand { text-align: center; margin-top: 18px; font-size: 11px; color: #94a3b8; }

  /* Modal */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.5);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: white; border-radius: 14px; padding: 24px;
    width: 100%; max-width: 360px; text-align: center;
  }
  .modal-box h3 { color: #0f766e; margin: 0 0 6px 0; }
  .modal-amount { font-size: 28px; font-weight: bold; color: #0f172a; margin: 10px 0 18px 0; }
  .modal-amount span { font-size: 14px; color: #64748b; font-weight: normal; }
  .pay-method-btn {
    width: 100%; padding: 13px; border-radius: 8px; border: 1px solid #cbd5e1;
    background: #f8fafc; font-size: 15px; cursor: pointer; margin-bottom: 10px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .pay-method-btn:hover { border-color: #0d9488; background: #f0fdfa; }
  .modal-cancel { color: #94a3b8; font-size: 13px; cursor: pointer; margin-top: 6px; background:none; border:none; }
  .modal-result { margin-top: 12px; font-size: 14px; min-height: 18px; }
  .login-error { color: #b91c1c; font-size: 13px; text-align: center; margin-top: 6px; min-height: 16px; }
</style>
</head>
<body>

<div class="wrap">
<div class="box">
  <h2>لوحة السكرتيرة</h2>
  <p class="subtitle" id="subtitleText">سجّلي دخولك</p>

  <div class="login-gate" id="loginGate">
    <input type="email" id="gateEmail" placeholder="الإيميل">
    <input type="password" id="gatePassword" placeholder="كلمة السر">
    <button class="main" onclick="gateLogin()">تسجيل الدخول</button>
    <div class="login-error" id="loginError"></div>
  </div>

  <div class="modal-overlay" id="checkinModal">
    <div class="modal-box">
      <h3>تسجيل الوصول</h3>
      <p style="color:#64748b; font-size:13px; margin:0;">المبلغ المستحق تحصيله الآن</p>
      <div class="modal-amount" id="modalAmount">— <span>جنيه</span></div>
      <button class="pay-method-btn" onclick="confirmCheckin('cash')">💵 كاش</button>
      <button class="pay-method-btn" onclick="confirmCheckin('electronic')">💳 إلكتروني</button>
      <button class="modal-cancel" onclick="closeModal()">إلغاء</button>
      <div class="modal-result" id="modalResult"></div>
    </div>
  </div>

  <div id="dashboard" style="display:none;">
    <button class="refresh-btn" onclick="loadBookings()">🔄 تحديث القائمة</button>
    <button class="refresh-btn" onclick="toggleWalkinForm()" style="background:#0d9488; color:white; border:none;">➕ إضافة مريض Walk-in</button>

    <div id="walkinForm" style="display:none; background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:14px; margin-bottom:14px;">
      <label style="font-size:13px; display:block; margin-bottom:4px;">اسم الطفل</label>
      <input type="text" id="wChildName" style="width:100%; padding:9px; border:1px solid #cbd5e1; border-radius:6px; margin-bottom:8px; box-sizing:border-box;">
      <label style="font-size:13px; display:block; margin-bottom:4px;">تليفون ولي الأمر</label>
      <input type="text" id="wPhone" style="width:100%; padding:9px; border:1px solid #cbd5e1; border-radius:6px; margin-bottom:10px; box-sizing:border-box;">
      <button class="main" onclick="addWalkin()">إضافة للدور</button>
      <div id="walkinMessage" style="margin-top:8px; font-size:13px; text-align:center;"></div>
    </div>

    <div id="bookingsList"></div>
  </div>

  <div class="footer-brand">تم الإعداد بواسطة شركة Infinite Systems</div>
</div>
</div>

<script>
  const SUPABASE_URL = 'https://xqdndbswvvbtszptheks.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhxZG5kYnN3dnZidHN6cHRoZWtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NjEwNzUsImV4cCI6MjA5NzUzNzA3NX0.09dmmrv5YxMXJn6wuU0CtnrOJC1dWlbsPOwxVemqZcA';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const statusLabels = {
    pending_payment: 'في انتظار الدفع',
    confirmed: 'مؤكد',
    completed: 'انتهى',
    cancelled: 'ملغي'
  };

  async function gateLogin() {
    const email = document.getElementById('gateEmail').value.trim();
    const password = document.getElementById('gatePassword').value;
    const errorDiv = document.getElementById('loginError');
    errorDiv.textContent = '';
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      errorDiv.textContent = '❌ فشل تسجيل الدخول: ' + error.message;
      return;
    }
    document.getElementById('loginGate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('subtitleText').textContent = 'مسجّلة دخول كـ ' + data.user.email;
    loadBookings();
  }

  async function loadBookings() {
    const listDiv = document.getElementById('bookingsList');
    listDiv.innerHTML = '<p style="text-align:center; color:#94a3b8;">جاري التحميل...</p>';

    // كل الحجوزات (مؤقتًا بدون تقييد بـ"اليوم بالتحديد" لتسهيل الاختبار)
    const { data, error } = await supabaseClient
      .from('bookings')
      .select('*, children(name), locations(name)')
      .order('scheduled_at', { ascending: true });

    if (error) {
      listDiv.innerHTML = '<p style="color:#b91c1c;">❌ ' + error.message + '</p>';
      return;
    }

    if (!data || data.length === 0) {
      listDiv.innerHTML = '<div class="no-bookings">لا يوجد أي حجوزات حاليًا</div>';
      return;
    }

    listDiv.innerHTML = data.map(b => {
      const time = b.scheduled_at ? new Date(b.scheduled_at).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'}) : '—';
      const childName = b.children ? b.children.name : 'غير معروف';
      const locName = b.locations ? b.locations.name : '—';
      const visitTypeLabel = b.visit_type === 'exam' ? 'كشف حضوري' : (b.visit_type === 'in_person_consultation' ? 'استشارة حضورية' : 'استشارة عن بُعد');
      const checkinBtn = (b.status === 'pending_payment')
        ? `<button class="checkin-btn" onclick="openCheckin('${b.id}')">تسجيل الوصول والدفع</button>`
        : '';
      return `
        <div class="booking-card">
          <div class="booking-top">
            <span class="left">${time}</span>
            <span class="right">${childName}</span>
          </div>
          <div class="booking-meta">
            ${visitTypeLabel} — ${locName}
            <span class="status-tag status-${b.status}">${statusLabels[b.status] || b.status}</span>
          </div>
          ${checkinBtn}
        </div>
      `;
    }).join('');
  }

  function toggleWalkinForm() {
    const form = document.getElementById('walkinForm');
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
  }

  async function addWalkin() {
    const childName = document.getElementById('wChildName').value.trim();
    const phone = document.getElementById('wPhone').value.trim();
    const msgDiv = document.getElementById('walkinMessage');

    if (!childName || !phone) {
      msgDiv.textContent = 'اكتب اسم الطفل ورقم التليفون';
      msgDiv.className = '';
      msgDiv.style.color = '#b91c1c';
      return;
    }

    msgDiv.textContent = 'بنضيف... ⏳';
    msgDiv.style.color = '#475569';

    // 1. إنشاء ولي أمر "سريع" بدون حساب حقيقي
    const newGuardianId = crypto.randomUUID();
    const { error: gError } = await supabaseClient.from('guardians').insert({
      id: newGuardianId,
      phone: phone,
      auth_method: 'phone',
      consent_given: true,
      is_quick_added: true
    });
    if (gError) {
      msgDiv.textContent = '❌ ' + gError.message;
      msgDiv.style.color = '#b91c1c';
      return;
    }

    // 2. إضافة الطفل
    const { data: childData, error: cError } = await supabaseClient.from('children').insert({
      guardian_id: newGuardianId,
      name: childName
    }).select().single();
    if (cError) {
      msgDiv.textContent = '❌ ' + cError.message;
      msgDiv.style.color = '#b91c1c';
      return;
    }

    // 3. إنشاء الحجز (Walk-in: بدون عربون سابق)
    const { data: locData } = await supabaseClient.from('locations').select('id').limit(1).single();
    const { error: bError } = await supabaseClient.from('bookings').insert({
      child_id: childData.id,
      location_id: locData.id,
      scheduled_at: new Date().toISOString(),
      visit_type: 'exam',
      status: 'pending_payment'
    });
    if (bError) {
      msgDiv.textContent = '❌ ' + bError.message;
      msgDiv.style.color = '#b91c1c';
      return;
    }

    msgDiv.textContent = '✅ تمت الإضافة للدور!';
    msgDiv.style.color = '#15803d';
    document.getElementById('wChildName').value = '';
    document.getElementById('wPhone').value = '';
    loadBookings();
  }

  let activeCheckinBookingId = null;
  let activeCheckinAmount = 0;

  async function openCheckin(bookingId) {
    const { data: settingsData } = await supabaseClient.from('settings').select('*');
    const settingsMap = {};
    (settingsData || []).forEach(r => settingsMap[r.key] = r.value);

    // نجيب نوع الزيارة بالتحديد عشان نحدد السعر الصحيح
    const { data: bookingRow } = await supabaseClient.from('bookings').select('visit_type').eq('id', bookingId).single();
    const visitType = bookingRow ? bookingRow.visit_type : 'exam';

    let fullPrice;
    if (visitType === 'exam') fullPrice = parseFloat(settingsMap['exam_price'] || 300);
    else if (visitType === 'in_person_consultation') fullPrice = parseFloat(settingsMap['in_person_consultation_price'] || 150);
    else fullPrice = parseFloat(settingsMap['consultation_price'] || 80);
    const depositAmount = parseFloat(settingsMap['exam_deposit'] || 100);

    // نتحقق هل دُفع عربون قبل كده على الحجز ده (يفرّق بين حجز مسبق و Walk-in)
    const { data: existingPayments } = await supabaseClient
      .from('payments')
      .select('*')
      .eq('booking_id', bookingId)
      .eq('payment_type', 'deposit');

    const depositPaid = existingPayments && existingPayments.length > 0;
    const remainingAmount = depositPaid ? (fullPrice - depositAmount) : fullPrice;

    activeCheckinBookingId = bookingId;
    activeCheckinAmount = remainingAmount;
    document.getElementById('modalAmount').innerHTML = remainingAmount + ' <span>جنيه</span>';
    document.getElementById('modalResult').textContent = '';
    document.getElementById('checkinModal').classList.add('show');
  }

  function closeModal() {
    document.getElementById('checkinModal').classList.remove('show');
    activeCheckinBookingId = null;
  }

  async function confirmCheckin(method) {
    const bookingId = activeCheckinBookingId;
    const remainingAmount = activeCheckinAmount;
    const resultDiv = document.getElementById('modalResult');
    resultDiv.style.color = '#475569';
    resultDiv.textContent = 'جاري التسجيل... ⏳';

    // 1. تسجيل وقت الوصول وتأكيد الحجز
    const { error: updateError } = await supabaseClient
      .from('bookings')
      .update({ status: 'confirmed', arrival_time: new Date().toISOString() })
      .eq('id', bookingId);

    if (updateError) {
      resultDiv.style.color = '#b91c1c';
      resultDiv.textContent = '❌ خطأ في تسجيل الوصول: ' + updateError.message;
      return;
    }

    // 2. تسجيل عملية دفع الباقي
    const { error: paymentError } = await supabaseClient.from('payments').insert({
      booking_id: bookingId,
      payment_type: 'remaining',
      method: method,
      amount: remainingAmount,
      status: 'completed'
    });

    if (paymentError) {
      resultDiv.style.color = '#b91c1c';
      resultDiv.textContent = '⚠️ تم تسجيل الوصول لكن فيه مشكلة في الدفع: ' + paymentError.message;
      return;
    }

    resultDiv.style.color = '#15803d';
    resultDiv.textContent = '✅ تم تحصيل ' + remainingAmount + ' جنيه (' + (method === 'cash' ? 'كاش' : 'إلكتروني') + ')';
    loadBookings();
    setTimeout(closeModal, 1300);
  }
</script>

</body>
</html>
