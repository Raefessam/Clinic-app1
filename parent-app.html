<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>العيادة الذكية - حساب ولي الأمر</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Tahoma', Arial, sans-serif;
    background: linear-gradient(180deg, #f0fdfa 0%, #ffffff 100%);
    margin: 0;
    padding: 20px 16px 40px 16px;
    min-height: 100vh;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  .box {
    background: white;
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  }
  .logo {
    width: 56px; height: 56px; background: #0d9488; border-radius: 50%;
    color: white; font-size: 24px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 12px auto;
  }
  h2 { color: #0f766e; margin: 0 0 4px 0; text-align: center; }
  p.subtitle { text-align: center; color: #64748b; font-size: 13px; margin: 0 0 18px 0; }

  /* تسجيل الدخول */
  .tabs { display: flex; background: #f1f5f9; border-radius: 10px; padding: 4px; margin-bottom: 18px; }
  .tab { flex: 1; text-align: center; padding: 8px; border-radius: 8px; cursor: pointer; font-size: 14px; color: #64748b; }
  .tab.active { background: #0d9488; color: white; font-weight: bold; }
  label { font-size: 13px; color: #334155; display: block; margin-bottom: 4px; margin-top: 12px; }
  input, select, textarea {
    width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px;
    font-size: 14px; font-family: inherit;
  }
  input:focus, select:focus { outline: 2px solid #0d9488; border-color: transparent; }
  .consent { display: flex; align-items: flex-start; gap: 8px; margin-top: 16px; font-size: 12.5px; color: #475569; }
  .consent input { width: auto; margin-top: 3px; }
  button.main {
    width: 100%; padding: 12px; background: #0d9488; color: white; border: none;
    border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 16px;
  }
  button.main:hover { background: #0f766e; }
  button.main:disabled { background: #94a3b8; }
  #authMessage, #loginError { margin-top: 12px; font-size: 13px; text-align: center; min-height: 16px; }
  .err { color: #b91c1c; } .ok { color: #15803d; }
  .forgot-link { text-align:center; margin-top:12px; font-size:13px; color:#0d9488; cursor:pointer; text-decoration:underline; }

  /* لوحة ولي الأمر بعد الدخول */
  .nav-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .nav-tab {
    flex: 1; text-align: center; padding: 10px 4px; border-radius: 8px; cursor: pointer;
    font-size: 12.5px; background: #f1f5f9; color: #0f766e; border: none;
  }
  .nav-tab.active { background: #0d9488; color: white; font-weight: bold; }

  .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .child-item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; font-size: 14px; }
  .child-item b { color: #0f766e; }

  .slot-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
  .slot-btn { padding: 10px 4px; border: 1px solid #cbd5e1; border-radius: 8px; background: white; cursor: pointer; font-size: 13px; text-align: center; }
  .slot-btn.selected { background: #0d9488; color: white; border-color: #0d9488; font-weight: bold; }
  .no-slots { color: #94a3b8; font-size: 13px; text-align: center; padding: 10px 0; }
  .price-box { background: #f0fdfa; border: 1px solid #99f6e4; border-radius: 8px; padding: 10px 14px; margin-top: 14px; font-size: 13px; color: #0f766e; }

  .queue-card { border-radius: 12px; padding: 18px; margin-bottom: 12px; text-align: center; }
  .queue-card.waiting { background: #f0fdfa; border: 1px solid #99f6e4; }
  .queue-card.notyet { background: #f8fafc; border: 1px solid #e2e8f0; }
  .queue-card .child-name { font-weight: bold; font-size: 15px; color: #0f172a; margin-bottom: 6px; }
  .queue-position { font-size: 36px; font-weight: bold; color: #0d9488; margin: 4px 0; }
  .queue-position .small { font-size: 13px; color: #64748b; font-weight: normal; }
  .wait-estimate { font-size: 13px; color: #475569; margin-top: 4px; }
  .your-turn { font-size: 18px; font-weight: bold; color: #15803d; }
  .status-note { font-size: 13px; color: #92400e; background: #fffbeb; border-radius: 8px; padding: 8px; margin-top: 8px; }

  .refresh-btn { background: #f1f5f9; color: #0f766e; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; margin-bottom: 14px; }
  .no-active { text-align: center; color: #94a3b8; padding: 30px 0; }
  #message { margin-top: 14px; font-size: 13px; text-align: center; }
  .footer-brand { text-align: center; margin-top: 18px; font-size: 11px; color: #94a3b8; }
</style>
</head>
<body>

<div class="wrap">
<div class="box">

  <!-- ========== شاشة تسجيل الدخول / التسجيل ========== -->
  <div id="authSection">
    <div class="logo">+</div>
    <h2>العيادة الذكية</h2>
    <p class="subtitle">حجزك ومتابعة أطفالك في مكان واحد</p>

    <div class="tabs">
      <div class="tab active" id="tabLogin" onclick="switchAuthTab('login')">تسجيل الدخول</div>
      <div class="tab" id="tabSignup" onclick="switchAuthTab('signup')">حساب جديد</div>
    </div>

    <label>الإيميل</label>
    <input type="email" id="authEmail" placeholder="example@email.com">
    <label>كلمة السر</label>
    <input type="password" id="authPassword" placeholder="••••••••">

    <div class="consent" id="consentRow" style="display:none;">
      <input type="checkbox" id="consent">
      <label style="margin:0;">أوافق على تخزين واستخدام بياناتي وبيانات أطفالي الطبية لتقديم الخدمة</label>
    </div>

    <button class="main" id="authSubmitBtn" onclick="submitAuth()">تسجيل الدخول</button>
    <div id="authMessage"></div>
    <div class="forgot-link" id="forgotLink" onclick="toggleForgot()">نسيت كلمة السر؟</div>
    <div id="forgotBox" style="display:none; margin-top:10px;">
      <input type="email" id="forgotEmail" placeholder="إيميلك">
      <button class="main" onclick="sendResetLink()">إرسال رابط إعادة التعيين</button>
      <div id="forgotMessage" style="margin-top:8px; font-size:13px; text-align:center;"></div>
    </div>
  </div>

  <!-- ========== لوحة ولي الأمر (بعد الدخول) ========== -->
  <div id="parentSection" style="display:none;">
    <p class="subtitle" id="welcomeText" style="margin-bottom:14px;"></p>

    <div class="nav-tabs">
      <button class="nav-tab active" id="navChildren" onclick="switchMainTab('children')">👶 أطفالي</button>
      <button class="nav-tab" id="navBooking" onclick="switchMainTab('booking')">📅 حجز</button>
      <button class="nav-tab" id="navQueue" onclick="switchMainTab('queue')">🔔 الدور</button>
      <button class="nav-tab" id="navNotif" onclick="switchMainTab('notif')">📩 الإشعارات</button>
    </div>

    <!-- تاب: أطفالي -->
    <div id="viewChildren">
      <div class="card">
        <label style="margin-top:0;"><b>إضافة طفل جديد</b></label>
        <input type="text" id="childName" placeholder="اسم الطفل" style="margin-bottom:8px;">
        <input type="date" id="birthDate" style="margin-bottom:8px;">
        <select id="gender" style="margin-bottom:8px;">
          <option value="">النوع (اختياري)</option>
          <option value="male">ذكر</option>
          <option value="female">أنثى</option>
        </select>
        <input type="text" id="bloodType" placeholder="فصيلة الدم (اختياري)" style="margin-bottom:8px;">
        <input type="text" id="allergies" placeholder="الحساسية (اختياري)" style="margin-bottom:8px;">
        <button class="main" onclick="addChild()">إضافة الطفل</button>
        <div id="childMessage" style="margin-top:8px; font-size:13px; text-align:center;"></div>
      </div>
      <div id="childList"></div>
    </div>

    <!-- تاب: الحجز -->
    <div id="viewBooking" style="display:none;">
      <label>اختر الطفل</label>
      <select id="childSelect"></select>
      <label>اختر العيادة</label>
      <select id="locationSelect" onchange="loadSlots()"></select>
      <label>نوع الزيارة</label>
      <select id="visitType" onchange="updatePrice()">
        <option value="exam">كشف حضوري</option>
        <option value="in_person_consultation">استشارة حضورية</option>
        <option value="remote_consultation">استشارة عن بُعد</option>
      </select>
      <div class="price-box" id="priceBox"></div>
      <label>اختر التاريخ</label>
      <input type="date" id="dateSelect" onchange="loadSlots()">
      <label>المواعيد المتاحة</label>
      <div class="slot-grid" id="slotGrid"><div class="no-slots">اختر تاريخ الأول</div></div>
      <button class="main" onclick="confirmBooking()" id="bookBtn">تأكيد الحجز</button>
      <div id="bookingMessage" style="margin-top:8px; font-size:13px; text-align:center;"></div>
    </div>

    <!-- تاب: الدور -->
    <div id="viewQueue" style="display:none;">
      <button class="refresh-btn" onclick="loadQueueStatus()">🔄 تحديث</button>
      <div id="queueList"></div>
    </div>

    <!-- تاب: الإشعارات -->
    <div id="viewNotif" style="display:none;">
      <button class="refresh-btn" onclick="loadNotifications()">🔄 تحديث</button>
      <div id="notifList"></div>
    </div>
  </div>

  <div class="footer-brand">تم الإعداد بواسطة شركة Infinite Systems</div>
</div>
</div>

<script>
  const SUPABASE_URL = 'https://xqdndbswvvbtszptheks.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhxZG5kYnN3dnZidHN6cHRoZWtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NjEwNzUsImV4cCI6MjA5NzUzNzA3NX0.09dmmrv5YxMXJn6wuU0CtnrOJC1dWlbsPOwxVemqZcA';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUser = null;
  let currentAuthMode = 'login';
  let settingsMap = {};
  let selectedSlot = null;

  /* ===== تسجيل الدخول / التسجيل ===== */
  function switchAuthTab(mode) {
    currentAuthMode = mode;
    document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
    document.getElementById('tabSignup').classList.toggle('active', mode === 'signup');
    document.getElementById('consentRow').style.display = mode === 'signup' ? 'flex' : 'none';
    document.getElementById('authSubmitBtn').textContent = mode === 'signup' ? 'إنشاء الحساب' : 'تسجيل الدخول';
    document.getElementById('authMessage').textContent = '';
  }

  async function submitAuth() {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const msgDiv = document.getElementById('authMessage');
    const btn = document.getElementById('authSubmitBtn');

    if (!email || !password) { msgDiv.textContent = 'اكتب الإيميل وكلمة السر'; msgDiv.className = 'err'; return; }
    if (currentAuthMode === 'signup' && !document.getElementById('consent').checked) {
      msgDiv.textContent = 'لازم توافق على تخزين البيانات أولًا'; msgDiv.className = 'err'; return;
    }

    btn.disabled = true;
    msgDiv.textContent = 'لحظات... ⏳'; msgDiv.className = '';

    if (currentAuthMode === 'signup') {
      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      if (error) { msgDiv.textContent = '❌ ' + error.message; msgDiv.className = 'err'; btn.disabled = false; return; }
      const { error: insertError } = await supabaseClient.from('guardians').insert({
        id: data.user.id, email: email, auth_method: 'email', consent_given: true
      });
      if (insertError) { msgDiv.textContent = '❌ ' + insertError.message; msgDiv.className = 'err'; btn.disabled = false; return; }
      currentUser = data.user;
    } else {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) { msgDiv.textContent = '❌ ' + error.message; msgDiv.className = 'err'; btn.disabled = false; return; }
      currentUser = data.user;
    }

    enterParentDashboard();
  }

  function toggleForgot() {
    const box = document.getElementById('forgotBox');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
  }

  async function sendResetLink() {
    const email = document.getElementById('forgotEmail').value.trim();
    const msgDiv = document.getElementById('forgotMessage');
    if (!email) { msgDiv.textContent = 'اكتب إيميلك أولًا'; msgDiv.style.color = '#b91c1c'; return; }
    msgDiv.textContent = 'بنبعت... ⏳'; msgDiv.style.color = '#475569';
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email);
    if (error) { msgDiv.textContent = '❌ ' + error.message; msgDiv.style.color = '#b91c1c'; return; }
    msgDiv.textContent = '✅ تم إرسال رابط إعادة التعيين'; msgDiv.style.color = '#15803d';
  }

  async function enterParentDashboard() {
    document.getElementById('authSection').style.display = 'none';
    document.getElementById('parentSection').style.display = 'block';
    document.getElementById('welcomeText').textContent = 'مسجّل دخول كـ ' + currentUser.email;

    const { data: settingsData } = await supabaseClient.from('settings').select('*');
    (settingsData || []).forEach(r => settingsMap[r.key] = r.value);

    await loadChildren();
    await loadLocationsDropdown();
    updatePrice();
  }

  /* ===== التنقل بين التابات الداخلية ===== */
  function switchMainTab(tab) {
    document.getElementById('viewChildren').style.display = tab === 'children' ? 'block' : 'none';
    document.getElementById('viewBooking').style.display = tab === 'booking' ? 'block' : 'none';
    document.getElementById('viewQueue').style.display = tab === 'queue' ? 'block' : 'none';
    document.getElementById('viewNotif').style.display = tab === 'notif' ? 'block' : 'none';
    document.getElementById('navChildren').classList.toggle('active', tab === 'children');
    document.getElementById('navBooking').classList.toggle('active', tab === 'booking');
    document.getElementById('navQueue').classList.toggle('active', tab === 'queue');
    document.getElementById('navNotif').classList.toggle('active', tab === 'notif');
    if (tab === 'queue') loadQueueStatus();
    if (tab === 'notif') loadNotifications();
    if (tab === 'booking') loadChildrenIntoBookingSelect();
  }

  /* ===== أطفالي ===== */
  async function addChild() {
    const name = document.getElementById('childName').value.trim();
    const msgDiv = document.getElementById('childMessage');
    if (!name) { msgDiv.textContent = 'اكتب اسم الطفل'; msgDiv.style.color = '#b91c1c'; return; }

    const { error } = await supabaseClient.from('children').insert({
      guardian_id: currentUser.id,
      name: name,
      birth_date: document.getElementById('birthDate').value || null,
      gender: document.getElementById('gender').value || null,
      blood_type: document.getElementById('bloodType').value.trim() || null,
      allergies: document.getElementById('allergies').value.trim() || null
    });

    if (error) { msgDiv.textContent = '❌ ' + error.message; msgDiv.style.color = '#b91c1c'; return; }
    msgDiv.textContent = '✅ تم إضافة الطفل بنجاح!'; msgDiv.style.color = '#15803d';
    document.getElementById('childName').value = '';
    document.getElementById('birthDate').value = '';
    document.getElementById('bloodType').value = '';
    document.getElementById('allergies').value = '';
    loadChildren();
  }

  async function loadChildren() {
    const { data, error } = await supabaseClient.from('children').select('*').eq('guardian_id', currentUser.id);
    const listDiv = document.getElementById('childList');
    if (error || !data || data.length === 0) {
      listDiv.innerHTML = '<p style="color:#94a3b8; font-size:13px;">لسه مفيش أطفال مضافين.</p>';
      return;
    }
    listDiv.innerHTML = '<p style="font-size:13px; color:#475569; margin-bottom:8px;"><b>أطفالك المسجّلين:</b></p>' +
      data.map(c => `<div class="child-item"><b>${c.name}</b> ${c.birth_date ? '— ' + c.birth_date : ''}</div>`).join('');
  }

  /* ===== الحجز ===== */
  async function loadChildrenIntoBookingSelect() {
    const { data, error } = await supabaseClient.from('children').select('*').eq('guardian_id', currentUser.id);
    const select = document.getElementById('childSelect');
    if (error || !data || data.length === 0) {
      select.innerHTML = '<option value="">لا يوجد أطفال — أضف طفل أولًا من تاب "أطفالي"</option>';
      return;
    }
    select.innerHTML = data.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  }

  async function loadLocationsDropdown() {
    const { data } = await supabaseClient.from('locations').select('*');
    const select = document.getElementById('locationSelect');
    select.innerHTML = (data || []).map(l => `<option value="${l.id}">${l.name}</option>`).join('');
  }

  function updatePrice() {
    const type = document.getElementById('visitType').value;
    const box = document.getElementById('priceBox');
    if (type === 'exam' || type === 'in_person_consultation') {
      const total = type === 'exam' ? (settingsMap['exam_price'] || '300') : (settingsMap['in_person_consultation_price'] || '150');
      const deposit = settingsMap['exam_deposit'] || '100';
      box.innerHTML = `السعر الكامل: ${total} ج | العربون المطلوب الآن: <b>${deposit} ج</b> | الباقي يُدفع وقت الوصول`;
    } else {
      const price = settingsMap['consultation_price'] || '80';
      box.innerHTML = `يُدفع بالكامل وقت الحجز: <b>${price} ج</b>`;
    }
  }

  async function loadSlots() {
    const dateStr = document.getElementById('dateSelect').value;
    const locationId = document.getElementById('locationSelect').value;
    const grid = document.getElementById('slotGrid');
    if (!dateStr || !locationId) { grid.innerHTML = '<div class="no-slots">اختر العيادة والتاريخ</div>'; return; }

    const date = new Date(dateStr + 'T00:00:00');
    const dayOfWeek = date.getDay();

    const { data: exceptions } = await supabaseClient
      .from('schedule_exceptions')
      .select('*')
      .eq('location_id', locationId)
      .eq('exception_date', dateStr);

    const closedException = (exceptions || []).find(e => e.exception_type === 'closed');
    if (closedException) {
      grid.innerHTML = '<div class="no-slots">العيادة مغلقة في هذا اليوم</div>';
      return;
    }

    const modifiedException = (exceptions || []).find(e => e.exception_type === 'modified_hours');
    const pharmaExceptions = (exceptions || []).filter(e => e.exception_type === 'pharma_rep');

    let scheduleRows;
    if (modifiedException) {
      scheduleRows = [{ start_time: modifiedException.start_time, end_time: modifiedException.end_time }];
    } else {
      const { data } = await supabaseClient
        .from('weekly_schedule')
        .select('*')
        .eq('location_id', locationId)
        .eq('day_of_week', dayOfWeek);
      scheduleRows = data;
    }

    if (!scheduleRows || scheduleRows.length === 0) {
      grid.innerHTML = '<div class="no-slots">العيادة مغلقة في هذا اليوم</div>';
      return;
    }

    let slots = [];
    scheduleRows.forEach(row => {
      let [h, m] = row.start_time.split(':').map(Number);
      const [endH, endM] = row.end_time.split(':').map(Number);
      while (h < endH || (h === endH && m < endM)) {
        slots.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);
        m += 30;
        if (m >= 60) { m = 0; h++; }
      }
    });

    pharmaExceptions.forEach(pe => {
      if (!pe.start_time || !pe.end_time) return;
      slots = slots.filter(s => s < pe.start_time.slice(0,5) || s >= pe.end_time.slice(0,5));
    });

    if (slots.length === 0) {
      grid.innerHTML = '<div class="no-slots">لا يوجد مواعيد متاحة هذا اليوم</div>';
      return;
    }

    grid.innerHTML = slots.map(s => `<div class="slot-btn" onclick="selectSlot('${s}', this)">${s}</div>`).join('');
    selectedSlot = null;
  }

  function selectSlot(time, el) {
    document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
    selectedSlot = time;
  }

  async function confirmBooking() {
    const messageDiv = document.getElementById('bookingMessage');
    const childId = document.getElementById('childSelect').value;
    const locationId = document.getElementById('locationSelect').value;
    const visitType = document.getElementById('visitType').value;
    const dateStr = document.getElementById('dateSelect').value;

    if (!childId) { messageDiv.textContent = 'اختر طفل أولًا'; messageDiv.className = 'err'; return; }
    if (!dateStr || !selectedSlot) { messageDiv.textContent = 'اختر التاريخ والموعد'; messageDiv.className = 'err'; return; }

    const scheduledAt = new Date(dateStr + 'T' + selectedSlot + ':00');
    const btn = document.getElementById('bookBtn');
    btn.disabled = true;
    messageDiv.textContent = 'بنأكد الحجز... ⏳'; messageDiv.className = '';

    const { error } = await supabaseClient.from('bookings').insert({
      child_id: childId, location_id: locationId, scheduled_at: scheduledAt.toISOString(),
      visit_type: visitType, status: 'pending_payment'
    });

    if (error) {
      if (error.code === '23505') {
        messageDiv.textContent = '⚠️ هذا الموعد تم حجزه للتو من مريض آخر، اختر موعدًا آخر.';
        loadSlots();
      } else {
        messageDiv.textContent = '❌ ' + error.message;
      }
      messageDiv.className = 'err'; btn.disabled = false; return;
    }

    messageDiv.textContent = '✅ تم تسجيل الحجز! تابع حالته من تاب "🔔 الدور"';
    messageDiv.className = 'ok'; btn.disabled = false;
  }

  /* ===== متابعة الدور ===== */
  /* ===== الإشعارات ===== */
  async function loadNotifications() {
    const listDiv = document.getElementById('notifList');
    listDiv.innerHTML = '<p style="text-align:center; color:#94a3b8;">جاري التحميل...</p>';

    const { data, error } = await supabaseClient
      .from('notifications')
      .select('*')
      .eq('guardian_id', currentUser.id)
      .order('sent_at', { ascending: false });

    if (error) { listDiv.innerHTML = '<p style="color:#b91c1c;">❌ ' + error.message + '</p>'; return; }
    if (!data || data.length === 0) {
      listDiv.innerHTML = '<div class="no-active">لا يوجد إشعارات حاليًا</div>';
      return;
    }

    listDiv.innerHTML = data.map(n => {
      const when = n.sent_at ? new Date(n.sent_at).toLocaleString('ar-EG') : '';
      return `<div class="card" style="text-align:right;">
        <div style="font-size:14px; color:#0f172a;">${n.message}</div>
        <div style="font-size:11px; color:#94a3b8; margin-top:4px;">${when}</div>
      </div>`;
    }).join('');
  }

  async function loadQueueStatus() {
    const listDiv = document.getElementById('queueList');
    listDiv.innerHTML = '<p style="text-align:center; color:#94a3b8;">جاري التحميل...</p>';
    const avgMinutes = parseFloat(settingsMap['avg_consultation_minutes'] || 15);

    const { data: children } = await supabaseClient.from('children').select('id, name').eq('guardian_id', currentUser.id);
    const childIds = (children || []).map(c => c.id);
    if (childIds.length === 0) { listDiv.innerHTML = '<div class="no-active">لا يوجد أطفال مسجّلين بعد</div>'; return; }

    const { data: myBookings, error } = await supabaseClient
      .from('bookings').select('*, children(name)').in('child_id', childIds).in('status', ['pending_payment', 'confirmed']);

    if (error) { listDiv.innerHTML = '<p style="color:#b91c1c;">❌ ' + error.message + '</p>'; return; }
    if (!myBookings || myBookings.length === 0) { listDiv.innerHTML = '<div class="no-active">لا يوجد حجوزات نشطة حاليًا</div>'; return; }

    let html = '';
    for (const b of myBookings) {
      const childName = b.children ? b.children.name : 'غير معروف';
      if (b.status === 'pending_payment') {
        html += `<div class="queue-card notyet"><div class="child-name">${childName}</div>
          <div class="status-note">لسه لازم تسجيل الوصول وتسوية الدفع عند الوصول للعيادة</div></div>`;
        continue;
      }
      const { data: aheadCount, error: rpcError } = await supabaseClient.rpc('get_queue_position', { p_booking_id: b.id });
      const safeAheadCount = rpcError ? 0 : (aheadCount || 0);
      const waitMinutes = safeAheadCount * avgMinutes;
      if (safeAheadCount === 0) {
        html += `<div class="queue-card waiting"><div class="child-name">${childName}</div><div class="your-turn">🎉 الدور عليك دلوقتي!</div></div>`;
      } else {
        html += `<div class="queue-card waiting"><div class="child-name">${childName}</div>
          <div class="queue-position">${safeAheadCount} <span class="small">مريض قبلك</span></div>
          <div class="wait-estimate">⏱️ الوقت التقريبي: حوالي ${waitMinutes} دقيقة</div></div>`;
      }
    }
    listDiv.innerHTML = html;
  }
</script>
